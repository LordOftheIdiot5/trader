# Trading configuration. No credentials here - those live in .env.
#
# This file is committed and published. Treat everything in it as public.

# "paper" fills locally against live prices. "live" sends real orders.
# Changing this is the single most consequential edit in the project.
mode: paper

paper:
  starting_cash: 100000
  quote_currency: USD
  # Charged against every fill, in both directions. Set these at or above
  # what your venue actually charges - a simulation that is cheaper than
  # reality produces strategies that only work in the simulation.
  slippage_bps: 10
  fee_bps: 10

# Hard caps. Every one is a refusal, not a warning. Sized for a first run;
# raise them deliberately, once you have watched the thing behave.
risk:
  max_order_notional: 1000      # biggest single order, quote currency
  max_daily_notional: 5000      # total traded per UTC day
  max_open_positions: 5
  daily_loss_limit: 250         # realised loss that trips the kill switch
  allow_short: false
  # Caps are checked against a fill this much worse than the quote, so a
  # market order cannot slip past a limit it nominally fits under.
  slippage_bps: 50

# Nothing outside this list can be traded, on any venue. An empty list is a
# configuration error rather than a wildcard.
# Stock tickers use Yahoo's suffixes, the same convention stockwatch uses:
# .OL Oslo, .ST Stockholm, .DE XETRA, .PA Paris, .L London, .CO Copenhagen,
# .HE Helsinki, no suffix for US. Crypto is always a PAIR with a slash - that
# slash is how the price router tells the two asset classes apart.
symbols:
  # Crypto only for now. Each symbol adds roughly 260 tokens to every desk
  # snapshot, and the snapshot is read by all four seats - so the list is
  # chosen for different drivers rather than length. Six more large-cap alts
  # that all follow BTC would add cost without adding information.
  crypto:
    - BTC/USD      # the market's beta; everything else is measured against it
    - ETH/USD      # largest alt, but moves with BTC most of the time
    - SOL/USD      # competing L1, its own ecosystem news
    - XRP/USD      # payments and legal outcomes - the least BTC-correlated here
    - LINK/USD     # infrastructure rather than a currency thesis
    - DOGE/USD     # pure sentiment, which is a genuinely different driver

paths:
  journal: var/journal.jsonl
  # `touch` this file to stop all trading immediately. Removing it is a
  # deliberate human action; nothing in the bot clears it.
  halt: var/HALT
  publish: site/data/state.json

# The multi-agent desk (--strategy desk). Four Claude calls per run: two
# analysts in parallel, then the chair, then risk. Cadence is the cost control
# that matters - at Opus 5 rates a run is roughly $0.10-0.20, so hourly is a
# few dollars a day and every-five-minutes is not.
desk:
  # Haiku runs the desk for roughly a fifth of Opus. It is the weaker
  # model at the thing this design needs - independent disagreement - so
  # read the first few runs before deciding it is good enough.
  model: claude-haiku-4-5
  min_minutes_between_runs: 60
  max_runs_per_day: 24
  # The chair weighs conflicting cases and is worth the effort; the analysts
  # mostly report what they see.
  analyst_effort: low
  chair_effort: high
  # The research seat searches the web for material news before the analysts
  # look at anything. Costs one extra call per run. Without it the desk sees
  # only the price series, which is why it kept concluding, correctly, that
  # forty flat numbers are forty flat numbers.
  use_research: true
